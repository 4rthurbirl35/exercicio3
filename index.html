<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Produto</title>
</head>
<body>
    <h2>Cadastrar Produto</h2>
    <form action="controller.php" method="POST">
        <label>Nome do Produto:</label><br>
        <input type="text" name="nome" required><br><br>

        <label>Preço Unitário(R$):</label><br>
        <input type="number" step="0.01" name="precoUnitario" required><br><br>

        <label>Quantidade:</label><br>
        <input type="number" name="quantidade" required><br><br>

        <label>Desconto (%):</label><br>
        <input type="number" step="0.01" name="percentualDesconto" value="0"><br><br>

        <button type="submit">Calcular e Salvar</button>
    </form>
</body>
</html>
